name: Make a Release

on:
  push:
    tags:
      # We want to create releases whenever semver tags
      # are pushed
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # Running this by hand builds the installers and uploads them as
  # workflow artifacts without publishing anything, so the packaging
  # path can be exercised without spending a tag on it. Only a tag
  # push creates a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on this trial build (not released)'
        required: false
        default: '0.0.8'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      WIX_VERSION: "5.0.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The tag is the single source of truth for the version of a
      # release. Strip its leading "v" to get the MAJOR.MINOR.PATCH
      # form that CMake and WiX both expect. A manual run has no tag
      # to read, so it takes the version from the workflow input.
      #
      # The input arrives through the environment rather than being
      # interpolated into the script, so its contents cannot be
      # treated as shell.
      - name: Derive version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Fail here with something readable rather than letting a
          # malformed version surface as a confusing CMake error.
          #
          # This has to match the whole string, not line by line. A
          # value carrying a newline would otherwise pass and write a
          # second line into GITHUB_ENV, setting an arbitrary variable
          # for every step that follows.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '${VERSION}' is not in MAJOR.MINOR.PATCH form." >&2
            exit 1
          fi

          echo "DRIVER_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Run CMake and build x86
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cmake --preset x86-release -DTRINO_ODBC_VERSION=%DRIVER_VERSION%
          cmake --build --preset x86-release

      - name: Run CMake and build x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --preset x64-release -DTRINO_ODBC_VERSION=%DRIVER_VERSION%
          cmake --build --preset x64-release

      - name: Add dotnet tool cli
        uses: actions/setup-dotnet@v5

      - name: Add WiX dotnet package
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Add WiX UI extension
        run: |
         wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      - name: Build x86 installer
        shell: pwsh
        run: |
          .\install\build_x86_installer.ps1 -Version $env:DRIVER_VERSION

      - name: Build x64 installer
        shell: pwsh
        run: |
          .\install\build_x64_installer.ps1 -Version $env:DRIVER_VERSION

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          if-no-files-found: error
          overwrite: true
          path: |
            install/*.msi
            install/LICENSE.rtf
            install/third_party_licenses.txt


  # We need to build on Windows, but we can create the releases
  # using Linux!
  release:
    runs-on: ubuntu-latest
    needs: build
    # Only a pushed tag publishes. A manual run stops after the build
    # job, leaving the installers as workflow artifacts to inspect.
    # Testing the event as well as the ref matters, because a manual
    # run can be pointed at a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: ./installers

      # Users download these installers over the internet, so publish
      # hashes alongside them to give people a way to confirm that what
      # arrived is what was released. The filenames are recorded
      # without a path so the file works with a plain `sha256sum -c`.
      - name: Generate checksums
        working-directory: ./installers
        run: sha256sum *.msi > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          # Draft the release notes from the pull requests merged since
          # the previous release, giving the maintainer something to edit
          # when reviewing the draft, rather than a blank release.
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            installers/*.msi
            installers/SHA256SUMS.txt
            installers/LICENSE.rtf
            installers/third_party_licenses.txt
