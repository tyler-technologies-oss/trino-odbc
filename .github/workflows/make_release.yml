name: Make a Release

on:
  push:
    tags:
      # We want to create releases whenever semver tags
      # are pushed
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      WIX_VERSION: "5.0.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The tag is the single source of truth for the version. Strip
      # its leading "v" to get the MAJOR.MINOR.PATCH form that CMake
      # and WiX both expect.
      - name: Derive version from tag
        shell: bash
        run: echo "DRIVER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Run CMake and build x86
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cmake --preset x86-release -DTRINO_ODBC_VERSION=%DRIVER_VERSION%
          cmake --build --preset x86-release

      - name: Run CMake and build x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --preset x64-release -DTRINO_ODBC_VERSION=%DRIVER_VERSION%
          cmake --build --preset x64-release

      - name: Add dotnet tool cli
        uses: actions/setup-dotnet@v5

      - name: Add WiX dotnet package
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Add WiX UI extension
        run: |
         wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}

      - name: Build x86 installer
        shell: pwsh
        run: |
          .\install\build_x86_installer.ps1 -Version $env:DRIVER_VERSION

      - name: Build x64 installer
        shell: pwsh
        run: |
          .\install\build_x64_installer.ps1 -Version $env:DRIVER_VERSION

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers
          if-no-files-found: error
          overwrite: true
          path: |
            install/*.msi
            install/LICENSE.rtf
            install/third_party_licenses.txt


  # We need to build on Windows, but we can create the releases
  # using Linux!
  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: ./installers

      # Users download these installers over the internet, so publish
      # hashes alongside them to give people a way to confirm that what
      # arrived is what was released. The filenames are recorded
      # without a path so the file works with a plain `sha256sum -c`.
      - name: Generate checksums
        working-directory: ./installers
        run: sha256sum *.msi > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          # Draft the release notes from the pull requests merged since
          # the previous release, giving the maintainer something to edit
          # in step 4 of HOW_TO_RELEASE.md rather than a blank release.
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            installers/*.msi
            installers/SHA256SUMS.txt
            installers/LICENSE.rtf
            installers/third_party_licenses.txt
